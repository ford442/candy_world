# Tier 2 - full Emscripten build, artifact/export verification, and the
# C++-required parity tests, with the pinned emsdk (.emsdk-version).
# Runs on pull requests that touch the native ABI or its bridges (path-filtered
# below), release tags, nightly main, workflow_dispatch, and main pushes.
# Fail-closed: build.sh exits 0 when em++ is missing, so `check:native-artifacts`
# turns a missing, truncated or incomplete artifact into a failure, and every
# C++ parity test runs with CANDY_PARITY_REQUIRE_CPP=1 so a skip cannot pass.
# Not marked as a required check: a path-filtered workflow that never starts
# would block PRs that do not touch these paths (docs/CI_CONTRACT.md).
name: Emscripten Verify

permissions:
    contents: read

on:
    pull_request:
        branches: [main]
        paths:
            - 'emscripten/**'
            - 'assembly/**'
            - 'src/utils/wasm-*.ts'
            - 'src/utils/native-*.ts'
            - 'src/systems/ecs/**'
            - 'src/systems/fauna/boids-bridge.ts'
            - 'src/audio/worklet/**'
            - 'verification/**'
            - 'scripts/check-emcc-manifest.mjs'
            - 'scripts/check-native-exports.mjs'
            - 'scripts/check-native-artifacts.mjs'
            - 'scripts/check-dsp-wasm.mjs'
            - 'scripts/check-memory-layout.mjs'
            - 'scripts/gen-native-types.mjs'
            - 'scripts/memory-layout.mjs'
            - 'scripts/native-structs.json'
            - 'scripts/native-exports-baseline.json'
            - 'tests/parity.mjs'
            - 'tests/native-*.test.mjs'
            - 'tests/character-controller-native.test.mjs'
            - 'tests/dsp-render.test.mjs'
            - '.github/workflows/emscripten-verify.yml'
            - 'package.json'
            - '.emsdk-version'
    push:
        branches: [main]
        tags:
            - 'v*'
            - '*-stable*'
            - '20*'
        paths:
            - 'emscripten/**'
            - 'src/utils/wasm-*.ts'
            - 'src/audio/worklet/**'
            - 'tests/dsp-render.test.mjs'
            - 'scripts/check-dsp-wasm.mjs'
            - 'verification/**'
            - 'scripts/check-emcc-manifest.mjs'
            - '.github/workflows/emscripten-verify.yml'
            - 'package.json'
            - '.emsdk-version'
    schedule:
        # Nightly sanity on main (UTC)
        - cron: '17 6 * * *'
    workflow_dispatch:

env:
    CANDY_DEBUG: '0'
    CANDY_STRICT_EMSDK: '1'

jobs:
    build-and-verify:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        concurrency:
            group: ${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: ${{ github.event_name == 'pull_request' }}
        # Path filters on push:tags are ignored by GitHub when only tags: is set
        # under the same push block — tags always run. Scheduled + dispatch always run.
        steps:
            - uses: actions/checkout@v7

            - name: Read pinned emsdk version
              run: echo "EM_VERSION=$(tr -d '[:space:]' < .emsdk-version)" >> "$GITHUB_ENV"

            - name: Setup emsdk
              uses: emscripten-core/setup-emsdk@v16
              with:
                  version: ${{ env.EM_VERSION }}
                  actions-cache-folder: emsdk-cache

            - name: Verify em++
              run: em++ -v

            - uses: pnpm/action-setup@v6
              with:
                  version: 9

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install root deps
              run: pnpm install --frozen-lockfile

            # Cheap and lexical: fail on a drifted manifest or flag contract
            # before spending the compile.
            - name: Lexical manifest lint (EXPECTED_EXPORTS ⊆ exports.txt)
              run: pnpm run verify:emcc:manifest

            # Builds the threaded and single-threaded modules, then the garden
            # DSP module. build.sh exits 0 without em++, so the next step, not
            # this one, is what makes a missing artifact fail.
            - name: Build Emscripten WASM (CANDY_DEBUG=0)
              run: pnpm run build:emcc
              env:
                  CANDY_DEBUG: '0'

            # Fail-closed: all five artifacts (MT, ST, DSP) exist, are valid
            # WebAssembly, expose every exports.txt name through their glue,
            # and the ST module instantiates in Node with each one callable.
            - name: Native artifacts present and complete (fail-closed)
              run: pnpm run check:native-artifacts

            - name: Verify WASM exports (strict)
              run: pnpm run verify:emcc --strict

            - name: Build AssemblyScript WASM
              run: pnpm run build:wasm

            # Skipped in the PR gate (no build:emcc output there): parsed C++
            # ABI == the built glue's exports, AS ABI == candy_physics.wasm.
            - name: Parsed ABI matches the built modules
              run: pnpm run test:native-exports

            # build:emcc also built the garden DSP module; a skip here would hide a failed build.
            - name: Garden DSP module (ABI + offline render, golden, 64-voice budget)
              run: pnpm run check:dsp-wasm && pnpm run test:dsp-render
              env:
                  CANDY_DSP_REQUIRE: '1'

            # build:emcc just ran, so a C++ SKIP here means the module failed to
            # load or lost an export. It must fail, not read as green.
            - name: Cross-tier parity (TS ↔ AssemblyScript ↔ C++)
              run: pnpm run test:parity
              env:
                  CANDY_PARITY_REQUIRE_CPP: '1'

            - name: Native physics assist-only ABI (#1822)
              run: pnpm run test:character-native
              env:
                  CANDY_PARITY_REQUIRE_CPP: '1'

            # Batch ground paths through the production bridges, C++ ↔ AS ↔ JS.
            - name: Native batch parity
              run: pnpm run test:native-batch-parity
              env:
                  CANDY_PARITY_REQUIRE_CPP: '1'

            - name: Fail if exports.txt drifted from the committed manifest
              run: |
                  if ! git diff --exit-code -- emscripten/exports.txt; then
                    echo ""
                    echo "emscripten/exports.txt was regenerated by build:emcc and differs from git."
                    echo "Commit the updated manifest:"
                    echo "  CANDY_DEBUG=0 pnpm run build:emcc"
                    echo "  pnpm run verify:emcc:manifest"
                    echo "  git add emscripten/exports.txt && git commit -m 'chore: refresh emscripten/exports.txt'"
                    exit 1
                  fi

            - name: Upload native WASM artifacts
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: candy-native-${{ github.event_name }}-${{ github.run_id }}
                  path: |
                      public/candy_native.wasm
                      public/candy_native.js
                      public/candy_native_st.wasm
                      public/candy_native_st.js
                      public/candy_dsp.wasm
                      emscripten/exports.txt
                  retention-days: 14
                  if-no-files-found: warn
