name: Node protocol tests

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    protocol:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install root deps
              run: pnpm install --frozen-lockfile

            - name: Presence protocol (mocked Realtime, no Supabase)
              run: pnpm run test:presence

            - name: Sugar Caves traversal + Part II unlock
              run: pnpm run test:sugar-caves
