name: Node protocol tests

permissions:
    contents: read

on:
    pull_request:
        branches: [main]
        # labeled/unlabeled re-run the baseline-direction check when a person
        # adds or removes `ratchet-reset` (docs/CI_CONTRACT.md).
        types: [opened, synchronize, reopened, labeled, unlabeled]
    push:
        branches: [main]

jobs:
    protocol:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        concurrency:
            group: ${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v6
              with:
                  version: 9

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install root deps
              run: pnpm install --frozen-lockfile

            # test:fast is the PR gate: every node-only suite (physics/WASM
            # parity, protocol, traversal, rendering-config and repo-integrity
            # guards), and nothing that needs a browser or a Vite build. It
            # runs in well under a minute on this runner.
            #
            # The browser-dependent smoke runs (`test`, `test:smoke:fast`) and
            # `vite build` live in `test:integration`, which is local/nightly
            # only — this job installs no Playwright browser and passes no
            # --enable-unsafe-webgpu, so those cannot pass here. See
            # docs/CI_CONTRACT.md.
            - name: Node test suite (PR gate)
              run: pnpm run test:fast

            - name: Stale-Squash Guard
              if: github.event_name == 'pull_request'
              run: node scripts/check-stale-squash.mjs

            - name: PR Description Guard
              if: github.event_name == 'pull_request'
              env:
                  PR_BODY: ${{ github.event.pull_request.body }}
              run: node scripts/check-pr-description.mjs

    # Shared worlds (#1975): apply supabase/migrations to a plain Postgres
    # (supabase/tests/platform-stubs.sql stands in for auth, storage and
    # realtime), then run the advisor-style lints and every RLS policy check.
    supabase-rls:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Migration, advisor lints and RLS policies
              env:
                  PGHOST: localhost
                  PGPORT: '5432'
                  PGUSER: postgres
                  PGPASSWORD: postgres
                  CANDY_RLS_REQUIRED: '1'
              run: node scripts/check-supabase-rls.mjs

    # After a squash lands on main: the guard in push mode recovers the
    # branch's fork point from refs/pull/<N>/head and, on a hit, files one
    # `stale-squash-landed` issue. It never fails the run on a detection (it
    # cannot un-merge). A separate job so that issues: write is never held by
    # the job that runs PR code, and with no concurrency group, so a second
    # quick merge cannot replace this run while it is pending.
    stale-squash-landed:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Stale-Squash Guard (push mode)
              id: stale
              run: node scripts/check-stale-squash.mjs

            - name: File the stale-squash issue
              if: steps.stale.outputs.stale != ''
              uses: actions/github-script@v9
              env:
                  STALE: ${{ steps.stale.outputs.stale }}
              with:
                  script: |
                      const fileIssue = require('./scripts/stale-squash-issue.cjs');
                      const res = await fileIssue({ github, context, stale: JSON.parse(process.env.STALE) });
                      core.info(`stale-squash issue ${res.action}: #${res.number}`);
