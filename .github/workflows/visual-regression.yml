name: Visual Regression Tests
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# DISABLED 2026-09-23 — manual (`workflow_dispatch`) only.
#
# WHY. This workflow had two halves and neither one worked:
#
#   * `update-baselines` (push to main) failed on every single run from
#     2026-09-19 through 2026-09-22 — 8+ consecutive reds — at the
#     "Commit updated baselines" step:
#         The following paths are ignored by one of your .gitignore files:
#         tools/visual-regression/test/baselines
#         hint: Use -f if you really want to add them.
#     `tools/visual-regression/.gitignore` line 3 ignores `test/baselines/`,
#     which is the exact directory the job tries to `git add`. It can never
#     succeed as written.
#
#   * `visual-regression` (pull requests) reported SUCCESS on every run — but
#     for the same reason. Because baselines are gitignored, `git ls-files
#     tools/visual-regression/test` returns nothing: there is not one baseline
#     image in the repository. `tools/visual-regression/cli.ts` handles a
#     missing baseline with `if (!baseline) { warn; continue; }`, so zero
#     comparisons run and the job exits 0 no matter what the renderer draws.
#     A check that cannot fail is not a check.
#
# Leaving it enabled meant a permanently-red status on main plus a
# permanently-green PR check that gated nothing. Both are worse than absent.
#
# TO RE-ENABLE, all three must be true:
#   1. Decide where baselines live. Either un-ignore
#      `tools/visual-regression/test/baselines/` and commit the PNGs (they are
#      binary and will grow the repo), or move them to an artifact/LFS store
#      the PR job can fetch. The current arrangement — generate in CI, commit
#      to a gitignored path — cannot work.
#   2. Make `cli.ts` fail, not warn-and-continue, when a viewpoint listed in
#      `ci.config.json` has no baseline. Otherwise a lost baseline silently
#      turns the check green again.
#   3. Prove it can fail: change a material colour in `src/`, push, and watch
#      this workflow go red. Only then restore the `push:`/`pull_request:`
#      triggers below.
#
# The job definitions are left intact and runnable via "Run workflow" so the
# capture pipeline can still be exercised by hand while the above is sorted.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          # Use pnpm since there is a pnpm-lock.yaml file
          npm install -g pnpm@9
          pnpm config set ignore-scripts false
          pnpm install
          cd tools/visual-regression
          pnpm config set ignore-scripts false
          pnpm install

      - name: Install Playwright
        run: |
          cd tools/visual-regression
          npx playwright install chromium

      - name: Build WASM
        run: |
          pnpm run build:ci

      - name: Start dev server
        run: |
          pnpm exec vite preview --port 5173 &
          npx wait-on http-get://localhost:5173 --timeout 120000

      - name: Run visual regression tests
        run: |
          cd tools/visual-regression
          pnpm run test:visual -- \
            --config ci.config.json \
            --threshold 0.05

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report-${{ github.run_id }}
          path: |
            tools/visual-regression/test/screenshots/report/
            tools/visual-regression/test/screenshots/diffs/
          retention-days: 7

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Visual Regression Test Results')
            );
            
            const body = `## 🎮 Visual Regression Test Results
            
            ❌ **Tests Failed** - [View Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            Please review the visual differences in the uploaded artifact.
            `;
            
            try {
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body
                });
              }
            } catch (err) {
              console.log("Could not post comment to PR. This may be due to token permissions.");
            }

  update-baselines:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install -g pnpm@9
          pnpm config set ignore-scripts false
          pnpm install
          cd tools/visual-regression
          pnpm config set ignore-scripts false
          pnpm install

      - name: Install Playwright
        run: |
          cd tools/visual-regression
          npx playwright install chromium

      - name: Build WASM
        run: |
          pnpm run build:ci

      - name: Start dev server
        run: |
          pnpm exec vite preview --port 5173 &
          npx wait-on http-get://localhost:5173 --timeout 120000

      - name: Update baselines
        run: |
          cd tools/visual-regression
          pnpm run test:visual -- \
            --config ci.config.json \
            --update

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit updated baselines
        run: |
          git add tools/visual-regression/test/baselines/
          if git diff --cached --quiet; then
            echo "ℹ️  No baseline changes to commit"
          else
            git commit -m "chore: update visual regression baselines [ci skip]"
            git push
          fi
