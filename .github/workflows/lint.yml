name: Lint
env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: ESLint ratchet (fail-closed gate)
              run: npm run lint

            - name: Verify Map Chunk Index
              run: npm run verify:chunk-index

            - name: ESLint (human-readable report)
              if: always()
              run: npx eslint src 2>&1 | tee eslint-report.txt || true

            - name: Upload lint reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: eslint-report-${{ github.event.pull_request.number || github.run_id }}
                  path: eslint-report.txt
                  retention-days: 14
                  if-no-files-found: warn
